name: 🩺 Monitoring — cartes.gouv.fr

on:
  schedule:
    # Toutes les 2 heures
    - cron: '0 */2 * * *'
  workflow_dispatch: # Déclenchement manuel

jobs:
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Préparer le dossier de rapports
        run: npm run prereport

      - name: Run monitoring tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          headless: true
          spec: cypress/e2e/monitoring.cy.js
          install: false

      - name: Fusionner les rapports JSON
        if: always()
        run: npm run report:merge || true

      - name: Générer le rapport HTML
        if: always()
        run: npm run report:generate || true

      - name: Upload rapport HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitoring-report-${{ github.run_number }}
          path: cypress/reports/html/
          retention-days: 30

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: monitoring-screenshots-${{ github.run_number }}
          path: cypress/screenshots
          retention-days: 14

      # ─── Notification en cas de panne ───────────────────────────────

      - name: Send alert on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🔴 ALERTE MONITORING — cartes.gouv.fr est peut-être en panne"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: |
            ⚠️ Le monitoring synthétique de cartes.gouv.fr a détecté un problème.

            Date : ${{ github.event.repository.updated_at || 'scheduled' }}
            Détails : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Vérifiez le rapport et les screenshots dans les artifacts.
