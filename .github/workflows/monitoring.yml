name: Monitoring

on:
  push:
    branches:
      - main

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "14"

      - name: Install dependencies
        run: npm install

      - name: Run pre-report
        run: npm run clean:reports

      - name: Upload Reports
        uses: actions/upload-artifact@v2
        with:
          name: reports
          path: ./reports/*