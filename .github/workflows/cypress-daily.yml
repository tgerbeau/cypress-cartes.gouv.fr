name: Cypress E2E Tests — cartes.gouv.fr

on:
  schedule:
    # Every day at 6:00 AM UTC
    - cron: '0 6 * * *'
  pull_request:        # Run on PRs (needed for Copilot agent auto-fix)
  workflow_dispatch:   # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Préparer le dossier de rapports
        run: npm run prereport

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          headless: true

      - name: Générer le rapport HTML
        if: always()
        run: npm run report:merge && npm run report:generate || true

      - name: Upload rapport HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ github.run_number }}
          path: cypress/reports/html/
          retention-days: 14

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7

      # ─── Notification email ─────────────────────────────────────────

      - name: Send email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🔴 Cypress E2E échoué — cartes.gouv.fr"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: |
            Les tests Cypress E2E pour cartes.gouv.fr ont échoué.

            Branche : ${{ github.ref_name }}
            Détails : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Vérifiez les screenshots et vidéos dans les artifacts du run.
